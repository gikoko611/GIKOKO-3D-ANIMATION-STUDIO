name: G.I Animation Render

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Animation idea or scene description"
        required: true
        type: string
      style:
        description: "Animation style"
        required: true
        default: "2d-cartoon"
        type: choice
        options:
          - 2d-cartoon
          - anime
          - motion-graphics
          - 3d-blender
      duration:
        description: "Duration in seconds (starter renderer supports 2-12)"
        required: true
        default: "5"
        type: string
      resolution:
        description: "Output resolution"
        required: true
        default: "480x854"
        type: choice
        options:
          - 480x854
          - 640x360
          - 720x1280

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Create render specification
        env:
          PROMPT: ${{ inputs.prompt }}
          STYLE: ${{ inputs.style }}
          DURATION: ${{ inputs.duration }}
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          mkdir -p work output
          python - <<'PY'
          import json, os
          spec = {
            "prompt": os.environ["PROMPT"],
            "style": os.environ["STYLE"],
            "duration": max(2, min(12, int(os.environ["DURATION"]))),
            "resolution": os.environ["RESOLUTION"]
          }
          with open("work/render-spec.json", "w", encoding="utf-8") as f:
              json.dump(spec, f, ensure_ascii=False, indent=2)
          PY

      - name: Render starter 2D animation
        run: |
          python animation_pipeline/render_2d.py work/render-spec.json output/gi-animation.mp4

      - name: Validate output
        run: |
          test -s output/gi-animation.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate -of json output/gi-animation.mp4

      - name: Upload MP4 and render specification
        uses: actions/upload-artifact@v4
        with:
          name: gi-animation-${{ github.run_number }}
          path: |
            output/gi-animation.mp4
            work/render-spec.json
          retention-days: 7
