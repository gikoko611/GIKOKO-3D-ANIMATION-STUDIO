name: AniCraft Android ARMv7 APK
on:
  push:
    branches: [anicraft-android-native, main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and SVG converter
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Generate launcher icon from repository logo
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          rsvg-convert -w 192 -h 192 icon.svg > app/src/main/res/drawable-nodpi/ic_launcher.png
          test -s app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build ARMv7-compatible APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo "Unexpected ARM64-only native library found"
            exit 1
          fi
          echo "APK build and package verification passed."
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniCraft-Android-ARMv7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release APK
        if: github.ref == 'refs/heads/anicraft-android-native'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: AniCraft Studio v0.1.0
          target_commitish: anicraft-android-native
          body: |
            AniCraft Studio Android native starter release.

            - Android 10+ (API 29)
            - ARMv7-compatible pure Kotlin/Java APK
            - Offline drawing, frame navigation, local draft save and PNG export
            - Uses the repository's existing icon.svg as the launcher icon

            This is an early native MVP, not full feature parity with the upstream AniCraft desktop editor.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
