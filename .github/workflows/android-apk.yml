name: Godot Android ARMv7 APK

on:
  workflow_dispatch:
  push:
    branches: [godot-migration]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.res'
      - '**.godot'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Validate and Build Godot Android ARMv7
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Godot project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/app.gd

      - name: Prepare output
        run: mkdir -p build

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export Android ARMv7 APK
        run: godot --headless --path . --export-debug "Android ARMv7" build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk

      - name: Verify APK contains ARMv7 native library
        run: |
          test -s build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk
          unzip -l build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk | grep -E 'lib/armeabi-v7a/.*\.so'

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7
          path: build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk
          if-no-files-found: error
          retention-days: 14
