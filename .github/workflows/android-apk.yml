name: AniCraft Android ARMv7 APK
on:
  push:
    branches: [anicraft-android-native, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and SVG converter
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Generate launcher icon from repository logo
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          rsvg-convert -w 192 -h 192 icon.svg > app/src/main/res/drawable-nodpi/ic_launcher.png
          test -s app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build ARMv7-compatible APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo "Unexpected ARM64-only native library found"
            exit 1
          fi
          if unzip -l "$APK" | grep -q 'lib/'; then
            unzip -l "$APK" | grep 'lib/'
          else
            echo "Pure Kotlin/Java APK: no native ABI-specific libraries; compatible with ARMv7 Android."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AniCraft-Android-ARMv7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
