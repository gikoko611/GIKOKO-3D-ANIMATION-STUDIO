name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.godot'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Android ARMv7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          unzip -oq /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android SDK and Java
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.3"
          JAVA_BIN="$(command -v javac)"
          JAVA_HOME_DIR="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt

      - name: Prepare output
        run: mkdir -p build

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export Android ARMv7 APK
        run: |
          godot --headless --path . --verbose --export-debug "Android ARMv7" build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk

      - name: Verify APK
        run: |
          test -s build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk
          "$ANDROID_HOME/build-tools/29.0.3/aapt" dump badging build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk
          "$ANDROID_HOME/build-tools/29.0.3/apksigner" verify build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk

      - name: Publish v0.0.1 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          name: G.I KO KO 3D ANIMATION STUDIO v0.0.1
          files: build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk
          overwrite_files: true
          make_latest: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7
          path: build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk
          if-no-files-found: error
          retention-days: 14
