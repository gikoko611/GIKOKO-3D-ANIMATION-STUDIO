name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.godot'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARMv7 APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output
        run: mkdir -p build

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export APK
        run: godot --headless --path . --export-debug "Android ARMv7" build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7
          path: build/GI-KO-KO-3D-ANIMATION-STUDIO-ARMv7.apk
          if-no-files-found: error
          retention-days: 14
